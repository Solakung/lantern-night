<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141a2b">
<title>ใต้แสงโคม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Sarabun:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game">
  <div id="bg" class="layer"></div>
  <div id="sprites" class="layer"></div>
  <div id="cg" class="layer hidden"></div>
  <div id="fx" class="layer"></div>

  <div id="titlecard" class="hidden"></div>

  <div id="textbox" class="hidden">
    <div id="namebox" class="hidden"></div>
    <div id="text"></div>
  </div>
  <div id="choices" class="hidden"></div>

  <div id="quick" class="hidden">
    <button id="q-auto">อัตโนมัติ</button>
    <button id="q-skip">ข้าม</button>
    <button id="q-log">ย้อนอ่าน</button>
    <button id="q-save">บันทึก</button>
    <button id="q-load">โหลด</button>
    <button id="q-menu">เมนู</button>
  </div>

  <div id="planner" class="screen hidden"></div>
  <div id="ending" class="screen hidden"></div>
  <div id="title" class="screen"></div>
  <div id="toast"></div>
</div>

<script src="js/data.js"></script>
<script src="js/parser.js"></script>
<script src="story/main_act1.js"></script>
<script src="story/main_act2.js"></script>
<script src="story/main_act3.js"></script>
<script src="story/route_baibua.js"></script>
<script src="story/route_nina.js"></script>
<script src="story/route_prang.js"></script>
<script src="story/route_mintra.js"></script>
<script src="story/route_fasai.js"></script>
<script src="story/dates.js"></script>
<script src="story/visits.js"></script>
<script src="story/activities.js"></script>
<script src="js/engine.js"></script>
<script src="js/schedule.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
